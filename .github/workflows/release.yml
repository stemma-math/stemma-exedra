# Publishes a release when the version in Cargo.toml reaches main with no tag
# for it yet. Releasing is changing the version in a pull request.
#
# Each build uploads its archive straight to a draft of the release, rather
# than as an artifact: release assets do not count against the Actions
# storage quota. The draft is published, and the commit tagged, at the end.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start a draft of the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft left by a run that failed is started again.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes ""

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so that the binary runs on any
          # Linux with its glibc or a newer one.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the web app
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the binary, with the web app embedded
        run: cargo build --release --locked --bin stemma
      - name: Package and upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name=stemma-$VERSION-${{ matrix.target }}
          mkdir "$name"
          cp target/release/stemma LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          gh release upload "v$VERSION" "$name.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  # The desktop app, which drives the `stemma` installed beside it. It is not
  # signed by a developer: macOS gets an ad hoc signature.
  app:
    name: Build the app for ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: '["deb", "appimage"]'
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundles: '["dmg"]'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install the app's and the web app's dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Build the app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          config=$(printf '{"version":"%s","bundle":{"active":true,"targets":%s,"macOS":{"signingIdentity":"-"}}}' "$VERSION" "$BUNDLES")
          pnpm --dir desktop tauri build --config "$config"
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name=stemma-app-$VERSION-${{ matrix.target }}
          bundle=desktop/src-tauri/target/release/bundle
          for file in "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            [[ -f "$file" ]] || continue
            cp "$file" "$name.${file##*.}"
            gh release upload "v$VERSION" "$name.${file##*.}" --repo "$GITHUB_REPOSITORY" --clobber
          done

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build, app]
    runs-on: ubuntu-latest
    steps:
      # The release notes, when the release has them: docs/releases/v<version>.md.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/releases
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'stemma-*'
          sha256sum stemma-* > SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release, and tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # While Stemma is 0.x, every release is a pre-release.
          prerelease=$([[ "$VERSION" == 0.* ]] && echo true || echo false)
          # Written notes go first, followed by the list GitHub generates.
          generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body)
          notes=docs/releases/v$VERSION.md
          { [[ -f "$notes" ]] && cat "$notes" && echo; echo "$generated"; } > notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md --prerelease="$prerelease" --draft=false

  # The command line's formula, and the app's cask.
  notify-tap:
    needs: release
    strategy:
      matrix:
        package: [stemma, stemma-app]
    uses: stemma-math/homebrew-tap/.github/workflows/notify.yml@main
    with:
      package: ${{ matrix.package }}
    secrets: inherit
