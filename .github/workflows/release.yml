# Publishes a release when the version in Cargo.toml reaches main with no tag
# for it yet. Releasing is changing the version in a pull request.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so that the binary runs on any
          # Linux with its glibc or a newer one.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the web app
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the binary, with the web app embedded
        run: cargo build --release --locked --bin stemma
      - name: Package
        run: |
          name=stemma-${{ needs.version.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/stemma LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: stemma-*.tar.gz

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # The release notes, when the release has them: docs/releases/v<version>.md.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum stemma-*.tar.gz > SHA256SUMS
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # While Stemma is 0.x, every release is a pre-release.
          prerelease=$([[ "$VERSION" == 0.* ]] && echo --prerelease || true)
          # Written notes go first, followed by the list GitHub generates.
          notes=docs/releases/v$VERSION.md
          [[ -f "$notes" ]] && notes_file=(--notes-file "$notes") || notes_file=()
          gh release create "v$VERSION" stemma-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" "${notes_file[@]}" --generate-notes $prerelease
