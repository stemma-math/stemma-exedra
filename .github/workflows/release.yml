# A release: on a version tag (`v0.1.0`), build the binary, with the web app
# embedded, for each platform, and publish it as the tag's GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so that the binary runs on any
          # Linux with its glibc or a newer one.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the web app
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the binary
        run: cargo build --release --locked --bin stemma
      - name: Package
        run: |
          name="stemma-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/stemma README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum stemma-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" stemma-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
