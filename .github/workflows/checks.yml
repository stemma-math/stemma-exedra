# The checks every pull request, and every change to main, must pass: the
# same as `just check`.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Formatting and flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Check the flake
        run: nix flake check --print-build-logs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- --deny warnings
      - name: Test
        run: cargo test

  desktop-rust:
    name: Desktop Rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install the design assets used by Tauri
        run: pnpm --dir .. install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- --deny warnings
      - name: Test
        run: cargo test

  lean:
    name: Library builds, with Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Lean's toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/fixture/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and inspect the test library
        run: STEMMA_TEST_LEAN=1 cargo test -p stemma-worker --test end_to_end lean

  web:
    name: Frontend (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [web, desktop]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.directory }}/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm check
      - name: Test
        if: matrix.directory == 'web'
        run: pnpm test
      - name: Build
        run: pnpm build
