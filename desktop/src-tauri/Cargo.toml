[package]
name = "stemma-desktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Stemma's desktop app and this machine's controls"
repository = "https://github.com/stemma-math/stemma-exedra"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stemma-client = { path = "../../crates/stemma-client" }
stemma-core = { path = "../../crates/stemma-core" }
stemma-worker = { path = "../../crates/stemma-worker" }
tauri = { version = "2", features = [] }
tokio = { version = "1.53.3", features = ["sync"] }

[dev-dependencies]
toml = "1.1.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
# Denied, not forbidden: main sets the login shell's PATH before any thread.
unsafe_code = "deny"

# This package is independent of the server workspace.
[workspace]
