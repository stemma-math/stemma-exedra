# An architecture of the workshop: a kind of work it knows. The hub lists
# every folder beside this one that has an `architecture.toml`.

name = "write"
description = "Edit a working paper as a conversation asked, check that it compiles with latexmk, and propose the change for approval."
# What of the group it changes: `paper`, the paper the task names.
works_on = "paper"
# The files the agent is given as its instructions, in this folder, in order.
instructions = ["instructions.md"]
# Changing any of these, the build's configuration, makes a change big: it
# then also needs an admin's approval. Deleting or renaming any file does
# too.
big = ["latexmkrc", ".latexmkrc"]

# What it does, in order. A workshop machine runs each step by its name, and
# refuses a task with a step it does not know.

[[steps]]
name = "work"
description = "The agent edits the paper's LaTeX source in a fresh worktree of its repository at main, with LaTeX and Stemma's tools."

[[steps]]
name = "compile"
description = "latexmk must make the PDF from main.tex, with BibTeX; if not, the agent is told why and works again, a few rounds at most."

[[steps]]
name = "propose"
description = "The change is committed with its provenance and pushed to the branch workshop/w<n>; the hub opens a pull request, which the asker approves (and one of the paper's authors, if the asker is not one; and an admin too, for a big change)."
